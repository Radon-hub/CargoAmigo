name: Continuous Integration

on:
  push:
    branches:
      - develop
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Start
        run: echo "Start building project!"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean verify

      - name: Verify Java
        run: java -version

      - name: Show files
        run: ls -la